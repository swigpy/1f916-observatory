name: Publish observatory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: observatory-pages
  cancel-in-progress: false
jobs:
  build:
    # Disabled during private iteration. Owner approval is required before enabling.
    if: github.ref == 'refs/heads/main' && vars.OBSERVATORY_PUBLIC_RELEASE_APPROVED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
        env:
          SITE_BASE_PATH: /1f916-observatory/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
